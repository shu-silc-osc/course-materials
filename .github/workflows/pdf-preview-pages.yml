name: Deploy PDF.js preview

on:
  push:
    branches: [main]
    paths:
      - 'courses/高数1/高数1（期末提纲）.pdf'
      - 'docs/pdf-preview/**'
      - '.github/workflows/pdf-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble static preview site
        shell: bash
        run: |
          site="$RUNNER_TEMP/pdf-preview-site"
          npm install --prefix "$RUNNER_TEMP/pdfjs" --no-save --no-package-lock --ignore-scripts pdfjs-dist@6.3.289
          mkdir -p "$site/assets"
          cp docs/pdf-preview/index.html "$site/index.html"
          cp "$RUNNER_TEMP/pdfjs/node_modules/pdfjs-dist/build/pdf.mjs" "$site/assets/pdf.mjs"
          cp "$RUNNER_TEMP/pdfjs/node_modules/pdfjs-dist/build/pdf.worker.mjs" "$site/assets/pdf.worker.mjs"
          cp 'courses/高数1/高数1（期末提纲）.pdf' "$site/study.pdf"
          echo "" > "$site/.nojekyll"
          echo "PDF preview site assembled: $(du -sh "$site" | cut -f1)"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pdf-preview-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
